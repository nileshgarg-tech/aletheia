[project]
name = "aletheia-arxiv-mcp"
version = "1.0.0"
description = "A small MCP server exposing the free arXiv API (search / get / recent) for MCP-native tools like Cursor, Antigravity, and Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
aletheia-arxiv-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
